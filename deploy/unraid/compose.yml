name: sparkyfitness

services:
  sparkyfitness-db:
    image: postgres:18.3-alpine
    container_name: sparkyfitness-db
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ${SPARKY_FITNESS_DB_NAME:?Set SPARKY_FITNESS_DB_NAME in .env}
      POSTGRES_USER: ${SPARKY_FITNESS_DB_USER:?Set SPARKY_FITNESS_DB_USER in .env}
      POSTGRES_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD:?Set SPARKY_FITNESS_DB_PASSWORD in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${UNRAID_APPDATA_ROOT:-/mnt/user/appdata/sparkyfitness}/postgresql:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sparkyfitness-network

  sparkyfitness-server:
    image: ${SPARKY_FITNESS_SERVER_IMAGE:?Set SPARKY_FITNESS_SERVER_IMAGE in .env}
    container_name: sparkyfitness-server
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      SPARKY_FITNESS_LOG_LEVEL: ${SPARKY_FITNESS_LOG_LEVEL:-ERROR}
      ALLOW_PRIVATE_NETWORK_CORS: ${ALLOW_PRIVATE_NETWORK_CORS:-false}
      ALLOW_PRIVATE_NETWORK_AI: ${ALLOW_PRIVATE_NETWORK_AI:-false}
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: ${SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS:-}
      SPARKY_FITNESS_PUBLIC_API_DOCS: ${SPARKY_FITNESS_PUBLIC_API_DOCS:-false}
      SPARKY_FITNESS_DB_HOST: sparkyfitness-db
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_DB_NAME: ${SPARKY_FITNESS_DB_NAME:?Set SPARKY_FITNESS_DB_NAME in .env}
      SPARKY_FITNESS_DB_USER: ${SPARKY_FITNESS_DB_USER:?Set SPARKY_FITNESS_DB_USER in .env}
      SPARKY_FITNESS_DB_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD:?Set SPARKY_FITNESS_DB_PASSWORD in .env}
      SPARKY_FITNESS_APP_DB_USER: ${SPARKY_FITNESS_APP_DB_USER:-sparky_app}
      SPARKY_FITNESS_APP_DB_PASSWORD: ${SPARKY_FITNESS_APP_DB_PASSWORD:?Set SPARKY_FITNESS_APP_DB_PASSWORD in .env}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_FITNESS_API_ENCRYPTION_KEY:?Set SPARKY_FITNESS_API_ENCRYPTION_KEY in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:?Set SPARKY_FITNESS_FRONTEND_URL in .env}
      SPARKY_FITNESS_TELEGRAM_BOT_TOKEN: ${SPARKY_FITNESS_TELEGRAM_BOT_TOKEN:-}
      SPARKY_FITNESS_TELEGRAM_WEBHOOK_SECRET: ${SPARKY_FITNESS_TELEGRAM_WEBHOOK_SECRET:-}
      SPARKY_FITNESS_TELEGRAM_WEBHOOK_URL: ${SPARKY_FITNESS_TELEGRAM_WEBHOOK_URL:-}
      SPARKY_FITNESS_DISABLE_SIGNUP: ${SPARKY_FITNESS_DISABLE_SIGNUP:-false}
      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKY_FITNESS_ADMIN_EMAIL:-}
      SPARKY_FITNESS_FORCE_EMAIL_LOGIN: ${SPARKY_FITNESS_FORCE_EMAIL_LOGIN:-true}
      SPARKY_FITNESS_EMAIL_HOST: ${SPARKY_FITNESS_EMAIL_HOST:-}
      SPARKY_FITNESS_EMAIL_PORT: ${SPARKY_FITNESS_EMAIL_PORT:-}
      SPARKY_FITNESS_EMAIL_SECURE: ${SPARKY_FITNESS_EMAIL_SECURE:-}
      SPARKY_FITNESS_EMAIL_USER: ${SPARKY_FITNESS_EMAIL_USER:-}
      SPARKY_FITNESS_EMAIL_PASS: ${SPARKY_FITNESS_EMAIL_PASS:-}
      SPARKY_FITNESS_EMAIL_FROM: ${SPARKY_FITNESS_EMAIL_FROM:-}
      GARMIN_MICROSERVICE_URL: ${GARMIN_MICROSERVICE_URL:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NODE_ENV: production
      TZ: ${TZ:-Europe/Berlin}
      DEV_TOOLS_ENABLED: ${DEV_TOOLS_ENABLED:-false}
    volumes:
      - ${UNRAID_APPDATA_ROOT:-/mnt/user/appdata/sparkyfitness}/backup:/app/SparkyFitnessServer/backup
      - ${UNRAID_APPDATA_ROOT:-/mnt/user/appdata/sparkyfitness}/uploads:/app/SparkyFitnessServer/uploads
    depends_on:
      sparkyfitness-db:
        condition: service_healthy
    networks:
      - sparkyfitness-network

  sparkyfitness-frontend:
    image: ${SPARKY_FITNESS_FRONTEND_IMAGE:?Set SPARKY_FITNESS_FRONTEND_IMAGE in .env}
    container_name: sparkyfitness-frontend
    restart: unless-stopped
    init: true
    ports:
      - "${SPARKY_FITNESS_BIND_ADDRESS:-0.0.0.0}:${SPARKY_FITNESS_FRONTEND_PORT:-3004}:${NGINX_LISTEN_PORT:-80}"
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:?Set SPARKY_FITNESS_FRONTEND_URL in .env}
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: 3010
      NGINX_RATE_LIMIT: ${NGINX_RATE_LIMIT:-5r/s}
      NGINX_LISTEN_PORT: ${NGINX_LISTEN_PORT:-80}
      NGINX_ACCESS_LOG: ${NGINX_ACCESS_LOG:-/dev/stdout}
      NGINX_ERROR_LOG: ${NGINX_ERROR_LOG:-/dev/stderr}
      NGINX_DUMP_CONFIG: ${NGINX_DUMP_CONFIG:-false}
    depends_on:
      sparkyfitness-server:
        condition: service_healthy
    networks:
      - sparkyfitness-network

networks:
  sparkyfitness-network:
    name: sparkyfitness-network
    driver: bridge
